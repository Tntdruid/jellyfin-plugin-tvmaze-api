name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test -c Release
      - run: dotnet publish src/Jellyfin.Plugin.TvMazeApi -c Release -o out
      - name: Package
        run: cd out && zip ../tvmaze-api.zip Jellyfin.Plugin.TvMazeApi.dll
      - uses: actions/upload-artifact@v4
        with:
          name: tvmaze-api
          path: tvmaze-api.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tvmaze-api.zip
