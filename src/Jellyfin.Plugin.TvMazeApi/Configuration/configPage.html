<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <title>TVmaze API</title>
</head>
<body>
<div id="TvMazeApiConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
    <div data-role="content">
        <div class="content-primary">
            <form id="TvMazeApiConfigForm">
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="MaxRequestsPerWindow" min="1" max="20" label="Maks. kald pr. vindue" />
                    <div class="fieldDescription">TVmaze tillader mindst 20 kald pr. 10 sekunder pr. IP.</div>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="WindowSeconds" min="10" label="Vindue (sekunder)" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="CacheMinutes" min="0" label="Cache (minutter)" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="MaxRetries" min="0" max="10" label="Maks. genforsøg ved 429" />
                </div>
                <div class="fieldDescription">Data fra <a href="https://www.tvmaze.com" target="_blank">TVmaze</a>, licenseret under CC BY-SA 4.0.</div>
                <button is="emby-button" type="submit" class="raised button-submit block"><span>Gem</span></button>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        var pluginId = '6f2b3c1e-8a4d-4f7b-9c2e-1d5a7b9e3f40';
        var fields = ['MaxRequestsPerWindow', 'WindowSeconds', 'CacheMinutes', 'MaxRetries'];
        document.querySelector('#TvMazeApiConfigPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                fields.forEach(function (f) { document.getElementById(f).value = config[f]; });
                Dashboard.hideLoadingMsg();
            });
        });
        document.querySelector('#TvMazeApiConfigForm').addEventListener('submit', function (e) {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                fields.forEach(function (f) { config[f] = parseInt(document.getElementById(f).value, 10); });
                ApiClient.updatePluginConfiguration(pluginId, config).then(Dashboard.processPluginConfigurationUpdateResult);
            });
            e.preventDefault();
            return false;
        });
    </script>
</div>
</body>
</html>
